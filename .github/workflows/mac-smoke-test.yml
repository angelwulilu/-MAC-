name: Mac 冒烟测试（字幕+字体，不管打包）

# ───────────────────────────────────────────────────────────────────────
# 这是「免费真 macOS」环境：GitHub 的 macos-latest runner 是真实的 Mac 机器。
#   · 公开仓库：macOS 分钟无限免费
#   · 私有仓库 Free：每月 2000 分钟按 10x 折算 ≈ 200 个 macOS 分钟（够跑二三十次）
# 限制：CI 没有显示器，GUI 窗口点不了。本程序的「干活」逻辑
#      （ffmpeg 字幕烧录 / 字体探测 / 模块可 import）是纯命令行，在
#      QT_QPA_PLATFORM=offscreen 下能真机验证。GUI 交互需借真 Mac 看。
#
# ⚠️ 和另一个 workflow 的区别（别点错）：
#   · 本文件（Mac 冒烟测试）  → 只验字幕/字体，**不打包 .app**，约 3~5 分钟
#   · mac-package.yml（Mac 打包）→ **产出 .app 成品**，约 6~10 分钟
#   要 .app 就点「Mac 打包（…产出 .app）」那个，不是这个。
#
# 用法（把 mac/ 单独作为 Git 仓库最简单）：
#   1) cd D:\video-tool\mac && git init && git add -A && git commit && git remote add origin <你的仓库> && git push
#   2) GitHub 仓库页 → Actions → 左侧选本 workflow → Run workflow
#   3) 跑完在 Artifacts 里下载 mac-burned-sample.mp4，肉眼看中文字形对不对
#
# 仓库布局兼容：无论把 mac/ 当仓库根，还是把整个 video-tool 当仓库根
#              （mac/ 作为子目录），本 workflow 都能自动定位代码目录。
# ───────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:            # 手动触发
    # 这里也放一个输入项：① 给用户一个「有表单」的确认信号，
    # ② 顺便能跳过耗时的字幕烧录步骤。
    inputs:
      burn_sample:
        description: '真机烧一条中文字幕样例（出 mp4 供肉眼看）'
        type: boolean
        default: true
  # 🔴 原来是 push 就自动跑 —— 那会**每推一次代码就烧一次 macOS 额度**。
  #    macOS runner 在私有仓库按 10 倍折算（免费 2000 分钟 ≈ 200 个 macOS 分钟），
  #    随手推几次就没了。改成只手动触发，想测再点。
  #    如果你的仓库设成 public，macOS 分钟无限免费，那可以放开成 push 自动跑：
  #  push:
  #    branches: ['**']

concurrency:
  group: mac-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-smoke:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen        # 防止任何 Qt 窗口在 CI 弹出
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 定位代码目录（兼容 mac/ 为仓库根 或 video-tool/ 为仓库根）
        id: loc
        run: |
          if [ -f "$GITHUB_WORKSPACE/mac/subtitle.py" ]; then
            echo "CODE=$GITHUB_WORKSPACE/mac" >> "$GITHUB_ENV"
          else
            echo "CODE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
          echo "代码目录 = $CODE"

      - name: 准备 ffmpeg（必须带 drawtext 滤镜，否则烧不了字幕）
        run: |
          # 🔴 brew 装的 ffmpeg 默认没开 --enable-libfreetype → 没有 drawtext 滤镜
          #    （2026-09-17 实测：brew ffmpeg 9.0.1_1 烧字幕报 No such filter: 'drawtext'）。
          #    因此不能用裸 brew install 就用，必须拿一个「带 drawtext」的静态构建。
          #    fetch_ffmpeg_mac.sh 会自动下载 osxexperts/evermeet/ffmpeg-static 等源，
          #    每个都校验 drawtext，没有就换下一个，最终仍没有就明确报错失败。
          #    下载来的二进制放进 $CODE/ffmpeg/ —— 这是 paths.find_ffmpeg() 的
          #    **第 1 优先级**位置，能盖过 /opt/homebrew/bin 那份残缺的 brew 版。
          bash "$CODE/fetch_ffmpeg_mac.sh" "$CODE/ffmpeg"
          # 顺手加进 PATH 兜底（让命令行直接敲 ffmpeg 也是对的）
          echo "$CODE/ffmpeg" >> "$GITHUB_PATH"
          echo "───── 下载结果 ─────"
          ls -la "$CODE/ffmpeg"
          ffmpeg -hide_banner -version 2>/dev/null | head -1 || true

      - name: 字体解析 + 交付物格式（不依赖 PySide6，先跑这道保底）
        run: |
          cd "$CODE"
          python3 _dev_tests/_verify_mac_fonts.py
          python3 _dev_tests/_verify_mac_format.py
          # 精简布局复跑：自检脚本里若有「查仓库外文件」的断言，本地能过、
          # runner 上必挂（真发生过，见 mac-package.yml 里那段复盘）。这一步专门抓它。
          python3 _dev_tests/_verify_runner_layout.py

      - name: 装 PySide6（Mac 上提供对应 arm64 wheel）
        run: pip install --upgrade pip PySide6

      - name: 中文字体候选诊断（先弄清 runner 上到底有没有）
        run: |
          # paths.resolve_fonts() 只认这几个 macOS 系统路径，逐个查一遍。
          # 2026-09-17 之前一直没搞清楚 runner 上有没有 —— 这一步就是为了别再猜。
          echo "───── resolve_fonts() 认的路径 ─────"
          for f in "/System/Library/Fonts/PingFang.ttc" \
                   "/System/Library/Fonts/Hiragino Sans GB.ttc" \
                   "/System/Library/Fonts/STHeiti Medium.ttc" \
                   "/System/Library/Fonts/STHeiti Light.ttc" \
                   "/System/Library/Fonts/Supplemental/Songti.ttc" \
                   "/System/Library/Fonts/Supplemental/Kaiti.ttc" \
                   "/System/Library/Fonts/Supplemental/FangSong.ttf"; do
            if [ -f "$f" ]; then echo "  存在 : $f"; else echo "  缺失 : $f"; fi
          done
          echo "───── /System/Library/Fonts 实际内容 ─────"
          ls -1 /System/Library/Fonts 2>/dev/null | head -40 || true

      - name: 程序可 import（offscreen）+ 字幕接口可用
        run: |
          cd "$CODE"
          python3 - <<'PY'
          import sys
          import paths, subtitle
          fonts = subtitle.available_fonts()
          print("Mac 上探测到的中文字体：", [n for n, _ in fonts])
          if not fonts:
              print("::warning title=runner 上没有中文字体::"
                    "resolve_fonts() 一个都没找到。这是 CI 环境限制（真实 Mac 上"
                    "有苹方/黑体），但下面那条烧录断言一定会失败 —— 属于已知情况。")
          assert fonts, ("❌ runner 上一个中文字体都没找到（见上面「存在/缺失」清单）。"
                         "这是 CI 环境限制，不代表 .app 有问题 —— 真机自测才算数。")
          print("find_ffmpeg() =", paths.find_ffmpeg())
          try:
              import app
              print("✅ app 模块 import 成功（PySide6 能起）")
          except Exception as e:
              print("⚠️ app import 失败（GUI 真机交互需借 Mac 看）：", repr(e))
          PY

      - name: 真实烧录一条中文字幕（drawtext 路，验证 Mac 字体 + freetype 真出中文字形）
        if: ${{ inputs.burn_sample }}
        run: |
          cd "$CODE"
          ffmpeg -y -f lavfi -i testsrc=duration=2:size=1080x1920:rate=30 -pix_fmt yuv420p /tmp/test_src.mp4
          python3 - <<'PY'
          import subtitle
          name, fp = subtitle.available_fonts()[0]
          print("用于测试的中文字体：", name, fp)
          ok, msg = subtitle.burn_subtitle_manual(
              "/tmp/test_src.mp4", "/tmp/test_burned.mp4",
              "广审测试 中文显示正常", 40, "#FFFFFF", 100,
              "bottom", "center", True, "9:16", font_file=fp)
          assert ok, "❌ 烧录失败：" + msg
          print("✅ drawtext 字幕烧录成功 -> /tmp/test_burned.mp4")
          PY

      - name: 额外验证 .ass 预设烧录（libass 路，best-effort 不阻塞）
        if: ${{ inputs.burn_sample }}
        run: |
          cd "$CODE"
          python3 - <<'PY'
          import os, shutil, subtitle
          presets = sorted(f for f in os.listdir("subtitle_presets") if f.endswith(".ass"))
          if presets:
              ap = os.path.join("subtitle_presets", presets[0])
              print("用预设验证 libass 路：", ap)
              ok, msg = subtitle.burn_subtitle_ass("/tmp/test_src.mp4", "/tmp/test_burned_ass.mp4", ap)
              print(("✅" if ok else "⚠️"), "libass 路：", msg)
              if ok and os.path.isfile("/tmp/test_burned_ass.mp4"):
                  shutil.copy("/tmp/test_burned_ass.mp4", "/tmp/test_burned.mp4")
          else:
              print("没有 .ass 预设可测")
          PY

      - name: 上传成品供肉眼检查
        if: ${{ always() && inputs.burn_sample }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-burned-sample
          path: /tmp/test_burned.mp4
          if-no-files-found: warn
