name: Mac 打包（产出 .app 成品 ← 要这个）

# ───────────────────────────────────────────────────────────────────────
# 为什么要有这个：PyInstaller 不能交叉编译 —— Windows 上打不出 macOS 包。
#   这个 workflow 用 GitHub **免费的 macOS runner**（真实的 Mac 机器）
#   替你跑一次打包，把 .app 当 Artifact 传回来。
#
# ⚠️ 和另一个 workflow 的区别（别点错）：
#   · 本文件（Mac 打包）→ **产出 .app 成品**，约 6~10 分钟，就是你要的
#   · mac-smoke-test.yml（Mac 冒烟测试）→ 只验字幕/字体，**不打包**，约 3~5 分钟
#   点 Run workflow 后**应该弹出表单**（有 run_tests / make_dmg 两个勾选项）。
#   如果没有表单 → 你点错 workflow 了，回到左侧列表换成本文件。
#
# 💰 额度（务必知道，超了会扣钱或排队）：
#   · 公开仓库（public） → macOS 分钟**完全免费、不限量**
#   · 私有仓库（private）→ 免费额度 2000 分钟/月，但 **macOS 按 10 倍折算**
#                          ≈ 只能跑 200 个 macOS 分钟
#   本 workflow 一次约 6~10 分钟 → 私有仓库大约能跑 20~30 次。
#   ⚠️ 所以别在 push 时自动触发（下面只留手动触发），改完代码想测再点一次。
#   ⚠️ 想无限免费又不在意代码公开 → 仓库设成 public。
#
# 🖥 runner 是 arm64（M 系列）→ 打出来的 .app **只能在 Apple 芯片的 Mac 上跑**。
#    需要 Intel 版 .app 的话，得用 macos-13（Intel runner，排队久、额度一样算）。
#
# ❗ CI 验不了算什么（别对它期待过高）：
#    runner **没有显示器**，任何 Qt 图形界面都点不了。所以下面这些**验不了**：
#      · 界面排版好不好看、按钮点起来顺不顺手
#      · 字幕预览拖动定位对不对、高分屏字糊不糊
#      · 菜单栏中文会不会被截断
#    它能验的是「**能不能跑起来 / 能不能干活**」：
#      PyInstaller 能不能通、.app 起不起得来、字体解析对不对、中文字幕烧不烧得出来。
#    → 界面问题仍然只能等真 Mac 上人肉看。
#
# 用法：GitHub 仓库页 → Actions → 左侧「Mac 打包」→ Run workflow
#       跑完在该次运行的页面底部 Artifacts 里下载 视频工具-macOS.zip
# ───────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:            # 只手动触发（省额度，见上面说明）
    inputs:
      run_tests:
        description: '顺带跑一遍字体/格式检查与字幕烧录冒烟测试'
        type: boolean
        default: true
      make_dmg:
        description: '额外打一个 .dmg（不勾也行，.zip 已够用）'
        type: boolean
        default: false

concurrency:
  group: mac-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-latest          # arm64；想试 Intel 版改成 macos-13
    # 兜底上限。本仓库是 public，macOS 的分钟数是**免费不限量**的，
    # 所以放宽没有成本；正常一轮约 15~25 分钟，45 太紧，一卡就整轮报废。
    # ⚠️ 被这条超时掐掉时，GitHub 显示的是 `cancelled`（不是 failure），
    #    很容易误判成「有人点了取消」而白重跑一轮 —— 看被掐那步的耗时就能分辨。
    timeout-minutes: 90

    env:
      QT_QPA_PLATFORM: offscreen   # CI 没显示器，禁止 Qt 弹窗
      # 🔴 自检**不许弹模态框**：QMessageBox 会等人点「确定」，CI 上没人点 → 永久卡死。
      #    offscreen 只解决「显示」，**不解决「阻塞」**。
      #    （2026-09-16 两次 run 各烧 45 分钟后被超时取消，根因就是它）
      VIDEOTOOL_SELFTEST_NOGUI: "1"
      # 🔴 让 print 立刻进日志：万一哪一步卡住，也能从日志看到已经跑到哪
      PYTHONUNBUFFERED: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          # 只取当前这一次提交，别拖历史（省时间）
          fetch-depth: 1

      # 定位代码目录：兼容「mac/ 当仓库根」和「video-tool 当仓库根(mac 是子目录)」
      - name: 定位代码目录
        id: loc
        run: |
          if [ -f "$GITHUB_WORKSPACE/mac/subtitle.py" ]; then
            echo "CODE=$GITHUB_WORKSPACE/mac" >> "$GITHUB_ENV"
          elif [ -f "$GITHUB_WORKSPACE/subtitle.py" ]; then
            echo "CODE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "❌ 找不到 subtitle.py，请检查仓库布局"; exit 1
          fi
          echo "代码目录 = $CODE"
          echo "runner 架构 = $(uname -m)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'     # 3.12 的 PySide6 wheel 最稳；别用太新的版本

# ── 1. 先跑不依赖 PySide6 的保底检查（快，坏了立刻知道）────────────────
      #
      # 🔴 这一组把 CI 卡死过**两次**，两次都是「本地全过、runner 秒挂」：
      #
      # 第一次 run 35060031916 —— **布局维度**
      #    自检脚本里有一批断言查的是**仓库外**的 Windows 侧文件
      #    （配置git.bat / _setup_git.py / 推送mac到github.bat / _push_mac.py /
      #    _package_mac_src.py）—— 它们在 D:\video-tool\ 下，而仓库的根就是 mac/，
      #    runner 上一个都没有 → 5 条 FAIL → exit 1。
      #    修法：这类断言统一走 check_win_side()，精简布局下「跳过」而不是「失败」。
      #
      # 第二次 run 35061816016 —— **平台维度**（修完布局后还是挂）
      #    ① _verify_mac_platform.py [1] 的 5 条断言写的是「paths.py 在 **Windows**
      #       行为不变」，在 macOS runner 上必然全 FAIL。
      #       修法：改走新增的 check_windows()，非 Windows 下跳过。
      #    ② _verify_mac_format.py [5] 断言「mac/ 下不存在 __pycache__」——
      #       而 CI 刚跑过 python3 _dev_tests/*.py，Python 必然生成它 → 必挂。
      #       本地过只是因为跑之前恰好没生成。这是**口径写错**：
      #       该验的是「.gitignore 排掉了它」，不是「磁盘上没有」。
      #
      # 防回归（三重）：
      #    · [6] 元检查 —— AST 扫源码，抓「查仓库外文件却没走 check_win_side」
      #    · [7] 元检查 —— AST 扫源码，抓「运行时断言 Windows 行为却是裸 check」
      #    · _verify_runner_layout.py —— **自检的自检**：把 mac/ 拷到临时目录当仓库根，
      #      **并把 sys.platform 伪装成 darwin**，同时复现「布局 + 平台」两个维度。
      #      ⚠️ 只模拟布局是不够的 —— 第二次就是因为漏了平台维度才又漏掉一遍。
      - name: 字体解析 + 交付物格式检查
        if: ${{ inputs.run_tests }}
        run: |
          cd "$CODE"

          # 🔴 先把「环境事实」打出来。上一次这个步骤连挂两轮都只有一句
          #    "Process completed with exit code 1"，什么线索都没有，
          #    而 GitHub 的 job 日志要登录才能下载（匿名 API 返回 403）。
          #    环境信息 + 每个脚本的完整输出 + 逐条 FAIL 都落到文件里，
          #    再由下面 always() 的上传步骤带走 —— 以后挂了一眼能看出原因。
          OUT=/tmp/selftest_out
          mkdir -p "$OUT"
          {
            echo "===== 环境事实 ====="
            echo "date        : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "uname -a    : $(uname -a)"
            echo "uname -m    : $(uname -m)"
            echo "CODE        : $CODE"
            echo "pwd         : $(pwd)"
            echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
            echo "which python3: $(command -v python3)"
            echo "which python : $(command -v python || echo '(无)')"
            python3 -VV
            python3 -c "import sys,os;print('sys.platform =',sys.platform);print('os.name =',os.name)"
            echo
            echo "===== 目录布局（CODE 顶层）====="
            ls -la "$CODE" | head -40
            echo
            echo "===== CODE 的父目录（看是不是仓库根）====="
            ls -la "$(dirname "$CODE")" | head -20
          } 2>&1 | tee "$OUT/00-环境.txt"

          # 每个脚本单独跑，**失败也继续** —— 这样一次就能看到全部失败项，
          # 不用「修一个再跑一次」把额度烧掉。
          #
          # 🔴 别写成 `if python3 xxx.py | tee log; then` —— 管道的退出码是 **tee 的**（恒 0），
          #    if 永远为真，脚本挂了也会报「通过」。要么 `set -o pipefail`，要么像下面
          #    这样拆两步、用 PIPESTATUS 取真正的退出码。（第一版就踩了这个坑。）
          rc_all=0
          for s in _verify_mac_fonts _verify_mac_format \
                   _verify_mac_platform _verify_runner_layout; do
            echo ""
            echo "════════════════════════════════════════════════"
            echo "  跑 $s.py"
            echo "════════════════════════════════════════════════"
            python3 "_dev_tests/$s.py" 2>&1 | tee "$OUT/$s.txt"
            rc=${PIPESTATUS[0]}          # 0 = python3 的退出码（不是 tee 的）
            if [ "$rc" = "0" ]; then
              echo "→ $s.py  exit=0  ✅"
            else
              echo "→ $s.py  exit=$rc  ❌"
              rc_all=1
            fi
          done

          # 把所有 FAIL 行汇总到一份文件，方便一眼看
          echo "===== 全部 FAIL 行 =====" > "$OUT/99-失败汇总.txt"
          grep -h "FAIL" "$OUT"/*.txt >> "$OUT/99-失败汇总.txt" 2>/dev/null || echo "(没有任何 FAIL 行)" >> "$OUT/99-失败汇总.txt"
          cat "$OUT/99-失败汇总.txt"

          echo ""
          echo "════════════════════════════════════════════════"
          if [ "$rc_all" = "0" ]; then
            echo "✅ 四个自检脚本全部通过"
          else
            echo "❌ 有脚本失败 —— 详细输出已写入 /tmp/selftest_out/，"
            echo "   会在本次运行的 Artifacts 里以「自检详细日志」上传。"
          fi
          exit $rc_all

# ── 2. 装依赖 ────────────────────────────────────────────────────
      - name: 装 PyInstaller 与 PySide6
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller PySide6 fontTools freetype-py
          # 🔴 fontTools / freetype-py：subtitle_tab.py 用它们做字体精确度量。
          #    漏装 → .app 自检报「模块 fontTools.ttLib / freetype 失败」，
          #    排版精度静默降级（不报错，所以很容易一直没发现）。

      - name: 确认依赖版本
        run: |
          python3 -c "import PySide6, PyInstaller, sys; \
            print('Python   :', sys.version.split()[0]); \
            print('PySide6  :', PySide6.__version__); \
            print('PyInst  :', PyInstaller.__version__)"
          # 字体度量用的两个包 —— 装了才有精确排版，必须确认在
          python3 -c "import fontTools, freetype; \
            print('fontTools:', fontTools.version); \
            print('freetype :', freetype.version())"

      # ── 3. 装 ffmpeg（给打包脚本当「本机那份」的候选）────────────────────
      #
      # 打包mac.sh 的 [3/6] 步要找一份 macOS ffmpeg 打进 .app，顺序是：
      #   ① _bundled_ffmpeg/ 已有 → ② use_local（command -v ffmpeg）→ ③ 网络下载
      #   （③ 的源：osxexperts.net / evermeet.cx / ffmpeg-static 的 GitHub Release）
      #
      # 🔴 2026-09-17 修正了一个**严重误判**：
      #   这里原来写着「brew 版自带 freetype/libass，烧字幕必需」，据此先 brew install
      #   好让 use_local 命中。**实际不是** —— 这个 runner 上 brew 装的 ffmpeg
      #   编译参数里**没有 --enable-libfreetype**，于是没有 drawtext 滤镜，
      #   被原样打进 .app → 「批量添加字幕」整个功能是坏的，
      #   而自检只跑 `-version`，一路绿灯，坏包差点发出去。
      #
      #   现在打包脚本自己会验 drawtext：本机这份不合格就**拒绝使用**、转去下载。
      #   所以这一步保留仍有用（合格时省一次下载），但**不再假设 brew 版一定合格**。
      #
      # 用 --quiet 压掉 Homebrew 的刷屏输出；这一步约 1~2 分钟。
      - name: 装 ffmpeg（给打包脚本当候选；不合格会被脚本自动跳过）
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "runner 已有 ffmpeg，跳过安装"
          else
            brew install ffmpeg --quiet || brew install ffmpeg
          fi
          echo "───── 本机 ffmpeg 就位 ─────"
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version | head -1
          echo "字幕相关编译项：$(ffmpeg -hide_banner -version 2>&1 \
            | grep -m1 '^configuration:' | tr ' ' '\n' \
            | grep -E 'libfreetype|libass|libfontconfig|libharfbuzz' | tr '\n' ' ')"
          # 🔴 这里**只报告、不判失败**：本机这份不合格时，打包脚本会自己转去下载。
          #    原来写的是 `grep ... || true` —— 「看起来在检查、其实永远通过」，
          #    这正是这次事故没被早发现的原因之一。
          if ffmpeg -hide_banner -filters 2>/dev/null | grep -qw drawtext; then
            echo "✅ 本机 ffmpeg 带 drawtext"
          else
            echo "::warning title=本机 ffmpeg 没有 drawtext::打包脚本会拒绝使用它、改为自行下载一份带 drawtext 的。这不是错误，但依赖下载源可达。"
          fi

# ── 4. 打包（核心步骤，直接调你那个脚本）────────────────────────────
      #
      # ⚠️ 这里**故意直接调 打包mac.sh**，而不是把打包逻辑抄一份到 workflow 里。
      #    这样「CI 里跑的」和「你在自己 Mac 上跑的」是**同一份脚本** ——
      #    如果 CI 能过而本地不行，那才是环境问题，不会因为脚本有两份而互相掩盖。
      #
      # ⚠️ 脚本默认 --both（还会去下另一架构的 ffmpeg，多花 1~2 分钟）。
      #    CI 里 .app 只装得下本机架构那一份，所以用 --one 省时间。
      - name: 打包（跑 打包mac.sh --one）
        run: |
          cd "$CODE"
          bash 打包mac.sh --one 2>&1 | tee /tmp/build.log
          # tee 是为了让日志既进 GitHub 的界面，也留一份给下面的步骤用

      - name: 确认产物真的出来了
        run: |
          cd "$CODE"
          APP="$CODE/dist/视频工具.app"
          if [ ! -d "$APP" ]; then
            echo "❌ 没找到 $APP"
            echo "───── 打包日志尾部 ─────"
            tail -60 /tmp/build.log || true
            exit 1
          fi
          echo "✅ 找到 .app"
          du -sh "$APP"
          echo "架构：$(lipo -archs "$APP/Contents/MacOS/视频工具" 2>/dev/null || file "$APP/Contents/MacOS/视频工具")"
          echo "───── 内置 ffmpeg ─────"
          ls -la "$APP/Contents/Resources/ffmpeg/" 2>/dev/null || \
            find "$APP" -name 'ffmpeg' -o -name 'ffprobe' | head -20

      # ── 4b. 🔴 硬校验：内置 ffmpeg 真的能烧字幕吗 ────────────────────────
      #
      # 为什么单独加这一步：`.app 自检` 只跑 `ffmpeg -version`，
      # **测不出「没有 drawtext 滤镜」这类缺陷** —— 2026-09-17 就是这么漏过去的。
      # 这一步直接查滤镜表，缺了就红：宁可不出包，也不交付一个烧不了字幕的 .app。
      - name: 硬校验：内置 ffmpeg 能烧字幕（drawtext / subtitles）
        run: |
          APP="$CODE/dist/视频工具.app"
          FF="$APP/Contents/Resources/ffmpeg/ffmpeg"
          [ -f "$FF" ] || FF=$(find "$APP" -name ffmpeg -type f | head -1)
          echo "内置 ffmpeg: $FF"
          "$FF" -hide_banner -version | head -1
          echo "字幕相关编译项：$("$FF" -hide_banner -version 2>&1 \
            | grep -m1 '^configuration:' | tr ' ' '\n' \
            | grep -E 'libfreetype|libass|libfontconfig|libharfbuzz' | tr '\n' ' ')"
          rc=0
          for f in drawtext subtitles; do
            if "$FF" -hide_banner -filters 2>/dev/null | grep -qw "$f"; then
              echo "  ✅ 滤镜 $f"
            else
              echo "  ❌ 滤镜 $f 缺失"
              rc=1
            fi
          done
          if [ "$rc" != "0" ]; then
            echo "::error title=内置 ffmpeg 缺滤镜，.app 烧不了字幕::上面缺的那个滤镜就是原因（drawtext 需要编译时开 --enable-libfreetype，subtitles 需要 --enable-libass）。这个包不要发出去。"
            exit 1
          fi

# ── 5. 在真 Mac 上启动 .app 跑自检 ────────────────────────────────
      #
      # 这一步比「打包成功」重要得多 —— 能验证 .app 真的**起得来**、
      # 内置 ffmpeg 找得到、字体解析得到。打包成功 ≠ 能用。
      - name: .app 自检（真机启动）
        run: |
          cd "$CODE"
          EXE="dist/视频工具.app/Contents/MacOS/视频工具"
          echo "───── 直接跑 --selftest ─────"
          if "$EXE" --selftest 2>&1 | tee /tmp/selftest.log; then
            if grep -q "全部正常" /tmp/selftest.log; then
              echo "✅ 自检通过：全部正常"
            else
              echo "⚠️ 自检跑完了但结论不是「全部正常」"
              cat /tmp/selftest.log
            fi
          else
            echo "⚠️ 自检返回非 0（可能是 CI 无显示器导致，看下面的输出）"
            cat /tmp/selftest.log || true
          fi

      - name: 打包 .app 为 zip
        run: |
          cd "$CODE/dist"
          # ⚠️ 用 ditto 不用 zip：ditto 会保留 macOS 的扩展属性与符号链接，
          #    解压出来的 .app 才是完整可双击的；普通 zip 可能丢资源叉。
          #    （.app 是个**文件夹**，必须整个压，不能只压里面的东西）
          ditto -c -k --keepParent "视频工具.app" "$RUNNER_TEMP/视频工具-macOS-arm64.zip"
          ls -lh "$RUNNER_TEMP/视频工具-macOS-arm64.zip"

      - name: 顺便把外置 ffmpeg 文件夹也带上
        run: |
          cd "$CODE/dist"
          # .app 旁边的 ffmpeg/ 是「可替换的那份」，一起发方便对方将来换版本
          if [ -d "ffmpeg" ]; then
            cp -R "ffmpeg" "$RUNNER_TEMP/ffmpeg-外置"
            (cd "$RUNNER_TEMP" && zip -qr 视频工具-macOS-arm64.zip "ffmpeg-外置" \
               && echo "已附加外置 ffmpeg/" )
          else
            echo "（dist/ffmpeg 不存在，跳过）"
          fi

# ── 6. 打成 zip 并上传 .app（🔴 交付物：必须在验证步骤之前）───────────
      - name: 上传 .app 成品
        uses: actions/upload-artifact@v4
        with:
          name: 视频工具-macOS-arm64
          path: ${{ runner.temp }}/视频工具-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14         # 14 天后自动清（省空间，也提醒你及时下载）

# ── 7. 真机烧一条中文字幕（验证字体 + drawtext 真出中文字形）──────────
      #
      # 🔴 这一步是「验证」不是「交付物」—— .app 已经在上面 zip 并上传完了。
      #    所以加 continue-on-error：它挂了也不影响你把 .app 拿走。
      #    2026-09-17 run #7 就是它挂了（2 秒），把后面的 zip + 上传全带成 skipped，
      #    结果 .app 明明打好了却下不到 —— 教训：产物步骤要在验证步骤**之前**。
      - name: 烧中文字幕（drawtext 路）
        if: ${{ inputs.run_tests }}
        continue-on-error: true
        run: |
          cd "$CODE"
          echo "───── runner 上的中文字体候选（paths.resolve_fonts 只认这些路径）─────"
          for f in "/System/Library/Fonts/PingFang.ttc" \
                   "/System/Library/Fonts/Hiragino Sans GB.ttc" \
                   "/System/Library/Fonts/STHeiti Medium.ttc" \
                   "/System/Library/Fonts/STHeiti Light.ttc" \
                   "/System/Library/Fonts/Supplemental/Songti.ttc" \
                   "/System/Library/Fonts/Supplemental/Kaiti.ttc" \
                   "/System/Library/Fonts/Supplemental/FangSong.ttf"; do
            if [ -f "$f" ]; then echo "  存在 : $f"; else echo "  缺失 : $f"; fi
          done
          echo "───── /System/Library/Fonts 实际内容 ─────"
          ls -1 /System/Library/Fonts 2>/dev/null | head -40 || true

          FF=$(find "$CODE/dist/视频工具.app" -name ffmpeg -type f | head -1)
          [ -n "$FF" ] || FF=ffmpeg
          echo "用这个 ffmpeg: $FF"
          "$FF" -y -f lavfi -i "testsrc=duration=3:size=1080x1920:rate=30" \
                -pix_fmt yuv420p /tmp/src.mp4

          cat > /tmp/burn_check.py <<'PY'
          import sys
          sys.path.insert(0, ".")
          import subtitle
          fonts = subtitle.available_fonts()
          print("探测到的中文字体（subtitle.available_fonts）：")
          for n, p in fonts:
              print("   ", n, "->", p)
          if not fonts:
              # 🔴 跳过必须是**看得见**的：green 的步骤 + 没有产物 = 事后完全看不出
              #    到底是「真烧了」还是「跳过了」（2026-09-17 run #8 就踩了这个，
              #    我还误判成「runner 有中文字体」）。用 ::warning:: 出黄色注解。
              print("::warning title=CI 上没找到中文字体，烧录验证被跳过::"
                    "resolve_fonts() 在 runner 上一个中文字体都没找到"
                    "（这是 CI 环境限制，不是 .app 的问题；你自己的 Mac 有苹方/黑体）。"
                    "本次没有真正烧录，所以也不会有样例视频。")
              sys.exit(0)
          name, fp = fonts[0]
          ok, msg = subtitle.burn_subtitle_manual(
              "/tmp/src.mp4", "/tmp/burned.mp4",
              "广审测试 中文显示正常", 40, "#FFFFFF", 100,
              "bottom", "center", True, "9:16", font_file=fp)
          print(("OK " if ok else "BAD"), "drawtext 烧录：", msg)
          sys.exit(0 if ok else 1)
          PY
          set +e
          python3 /tmp/burn_check.py 2>&1 | tee /tmp/burn.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "烧录验证退出码 = $rc（这一步挂了不影响上面已上传的 .app）"
          exit $rc

# ── 8. 打 dmg（可选）─────────────────────────────────────────────
      - name: 打 dmg（可选）
        if: ${{ inputs.make_dmg }}
        run: |
          cd "$CODE/dist"
          hdiutil create -volname "视频工具" -srcfolder "视频工具.app" \
                  -ov -format UDZO "$RUNNER_TEMP/视频工具-macOS-arm64.dmg" || true
          ls -lh "$RUNNER_TEMP"/*.dmg 2>/dev/null || echo "dmg 没生成（不影响 zip）"

      - name: 上传烧录样例视频（供肉眼看中文字形）
        if: ${{ always() && inputs.run_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: 中文字幕烧录样例
          path: /tmp/burned.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: 上传自检详细日志（第 5 步挂掉时的唯一线索）
        # ⚠️ 这一步专门为「第 5 步失败」准备：那次失败时 /tmp/build.log 之类的
        #    根本还没生成（打包没跑到），而 GitHub 的 job 日志又要登录才能下载。
        #    /tmp/selftest_out/ 是第 5 步写的环境信息 + 每个脚本完整输出 + FAIL 汇总，
        #    用 always() 保证失败也上传。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 自检详细日志
          path: /tmp/selftest_out/
          if-no-files-found: warn
          retention-days: 7

      - name: 上传打包日志（出错时用来看原因）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 打包日志
          path: |
            /tmp/build.log
            /tmp/selftest.log
            /tmp/burn.log
            /tmp/burn_check.py
            /tmp/selftest_out/
          if-no-files-found: warn
          retention-days: 7
